name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  data-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run data and reproducibility tests
        run: python -m unittest discover -s tests -v

  sql-tests:
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      QC_DB: quick_commerce_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Build database from committed CSVs
        run: bash scripts/load.sh --reset

      - name: Run SQL checks, analysis and assertions
        run: bash scripts/run_analysis.sh > analysis.log

      - name: Upload analysis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-analysis-log
          path: analysis.log
